<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Culture Head preview</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Courier+Prime:wght@400&family=Reenie+Beanie&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1eee8;--ink:#161614;--mute:#77736b;--line:rgba(22,22,20,.18);--mono:'Courier Prime','Courier New',monospace;--serif:'Newsreader',Georgia,serif;--hand:'Reenie Beanie','Segoe Script','Bradley Hand',cursive}
body.dark{--bg:#0f0e0d;--ink:#ece7de;--mute:#8d877c;--line:rgba(236,231,222,.18)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--mono);transition:background .4s,color .4s;overflow-x:hidden}
a{color:inherit}
section{height:100vh;height:100svh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden}
header{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;justify-content:space-between;padding:20px 28px;mix-blend-mode:difference;color:#fff;font-size:13px;letter-spacing:.06em;pointer-events:none}
header *{pointer-events:auto}
header nav{display:flex;gap:26px}
header a{text-decoration:none}
.hand{font-family:var(--hand);font-weight:400;line-height:.9;letter-spacing:.01em}
/* 1 uitgelicht */
.feat{background:#1b1917;color:#fff}
.feat>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.feat::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7),transparent 50%)}
.feat .hand{position:absolute;right:6vw;top:50%;transform:translateY(-50%) rotate(-3deg);z-index:2;font-size:clamp(44px,6vw,96px);text-align:right}
.feat .hand span{display:block}
.feat .hand span:last-child{margin-right:4vw}
.feat .txt{position:absolute;left:0;bottom:0;z-index:2;padding:0 28px 40px}
.feat .lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-bottom:12px}
.feat blockquote{font:italic 400 clamp(22px,2.6vw,38px)/1.2 var(--serif);max-width:640px;margin-bottom:12px}
.feat h2{font:400 clamp(44px,7vw,110px)/.95 var(--serif);letter-spacing:-.03em}
.feat a{color:#fff;display:inline-block;margin-top:14px;border-bottom:1px solid #fff;text-decoration:none;font-size:14px}
.scroll{position:absolute;right:150px;bottom:40px;z-index:2;font-size:12px;letter-spacing:.12em;color:#fff;opacity:.8}
/* 2 stories */
.cloud .center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:clamp(12px,2vw,30px);font-size:clamp(34px,4.4vw,68px);pointer-events:none;z-index:3}
.cloud .center span:first-child{transform:rotate(-2deg) translateY(2px)}
.cloud .center span:last-child{transform:rotate(1.5deg) translateY(-2px)}
.card{position:absolute;left:var(--l);top:var(--t);width:var(--w);display:block;text-decoration:none;z-index:2}
.card .ph{aspect-ratio:4/5;overflow:hidden;background:linear-gradient(160deg,#3a352f,#1b1917)}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.2,.7,.2,1),filter .4s;filter:saturate(.9)}
.card:hover{z-index:20}
.card:hover img{transform:scale(1.08);filter:none}
.card .cap{display:flex;justify-content:space-between;gap:6px;margin-top:6px;font-size:11px;letter-spacing:.05em;color:var(--mute);white-space:nowrap;overflow:hidden}
.card .cap b{font-weight:400;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.card .role{position:absolute;left:8px;bottom:30px;right:6px;color:#fff;font-size:10px;line-height:1.2;opacity:0;transform:translateY(6px);transition:.3s;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.card:hover .role{opacity:1;transform:none}
/* 3 over */
.about{display:grid;place-items:center;padding:0 28px}
.about p{max-width:1000px;font:400 clamp(28px,4vw,58px)/1.12 var(--serif);letter-spacing:-.02em}
.about p span{opacity:.15;transition:opacity .6s}
.about.in p span{opacity:1}
/* 4 studios */
.studios{display:flex;flex-direction:column;justify-content:space-between;padding:0}
.studios .body{flex:1;display:grid;grid-template-columns:repeat(12,1fr);column-gap:18px;align-content:center;row-gap:28px;padding:0 28px;border-top:1px solid var(--line)}
.studios h2{grid-column:1/7;font:400 clamp(34px,5vw,70px)/1 var(--serif);letter-spacing:-.03em;align-self:end}
.studios p{grid-column:7/12;font-size:15px;align-self:end}
.studios p a{display:inline-block;margin-top:18px;border-bottom:1px solid currentColor;text-decoration:none;font-size:14px}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:24px 28px 28px;border-top:1px solid var(--line);font-size:12px;color:var(--mute);letter-spacing:.06em}
/* cursor + mode */
@media (hover:hover) and (pointer:fine){html.chc,html.chc *{cursor:none!important}}
.chcur{position:fixed;left:0;top:0;width:48px;height:48px;z-index:9999;pointer-events:none;opacity:0;transition:opacity .2s;will-change:transform}
.chcur img{width:100%;height:100%;object-fit:contain;display:block;filter:brightness(0)}
.feat~.chcur img{filter:brightness(0)}
body.dark .chcur img{filter:brightness(0) invert(1)}
html.chc .chcur.show{opacity:1}
#mode{position:fixed;right:20px;bottom:20px;z-index:40;font:12px var(--mono);background:var(--ink);color:var(--bg);border:0;padding:9px 14px;cursor:pointer}
@media(max-width:800px){
 .card{left:var(--ml);top:var(--mt);width:var(--mw)}
 .card .cap{font-size:9px}
 .card .role{display:none}
 .feat .hand{right:5vw;font-size:clamp(34px,11vw,56px)}
 .feat .txt{padding:0 16px 28px}
 .feat blockquote{font-size:22px}
 .scroll{display:none}
 .cloud .center{font-size:clamp(30px,10.5vw,52px)}
 .about{padding:0 16px}
 .studios .body{padding:0 16px}
 .studios h2,.studios p{grid-column:1/13}
 footer{padding:16px}
 header{padding:16px}
 #mode{bottom:14px;right:14px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body>
<header><a href="#top">CULTURE HEAD</a><nav><a href="#stories">Stories</a><a href="#over">Over</a><a href="#studios">Studios</a></nav></header>

    <h2>Ella John</h2>

  </div>
  <div class="scroll">SCROLL &darr;</div>
</section>

<section class="cloud" id="stories">
  <div
